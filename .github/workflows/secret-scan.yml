# CI 비밀 키 검사 관문 — 대표 결정 CX1123-08 = B(D26556, 11-23): 새로 들어오는 커밋에 비밀 키 꼴이 있으면 실패 → 머지 막음.
# 새 커밋만 봄(PR = origin/<대상 가지>..head · push = before..after, 새 가지·force-push 는 다른 원격 가지에 없는 커밋 전부) — 옛 키로는 막지 않음.
# 값은 로그에 안 찍음(gitleaks --redact + report.py 는 파일:행·종류만). 본체 .github/secret-scan/scan.sh. 자체 호스팅 러너.
# 정본: mwork2 ~/runs/armada/secgate-1123/repo (주인·Armada)
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# push 는 실행마다 자기 구간(before..after)만 보므로 서로 취소하지 않음(검수 r1 P1-4) — PR 만 새 실행이 앞 실행을 취소
concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    runs-on: [ci-linux-x64, ci-light]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (새 커밋만 · 값 안 찍음)
        env:
          GL_VER: "8.30.1"
          GL_SHA: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          EV: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          t="$(mktemp -d)"; trap 'rm -rf "$t"' EXIT
          curl -fsSL --retry 3 -o "$t/gl.tgz" "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VER}/gitleaks_${GL_VER}_linux_x64.tar.gz"
          echo "${GL_SHA}  $t/gl.tgz" | sha256sum -c - >/dev/null
          tar -xzf "$t/gl.tgz" -C "$t" gitleaks
          GL="$t/gitleaks" bash .github/secret-scan/scan.sh
